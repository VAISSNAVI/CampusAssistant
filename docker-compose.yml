version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: campus_assistant_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: super-secure-jwt-secret-for-campus-assistant-krce
      CORS_ORIGINS: http://localhost:3001,http://localhost:5173,http://localhost:8081
    ports:
      - "3000:3000"
    volumes:
      - sqlite-data:/app/apps/api/data
    command: sh -c "npm --workspace=@campus-assistant/api run db:migrate && npm --workspace=@campus-assistant/api run start"

volumes:
  sqlite-data:
